name: assisted-model-selection-poc
services:
  - name: web
    source_dir: /
    github:
      repo: shreyasee-n/model-selection
      branch: main
    build_command: npm ci
    run_command: npm start
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    envs:
      - key: PORT
        value: "8080"
